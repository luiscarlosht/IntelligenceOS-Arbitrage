name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    env:
      M78_TEST_WHEELHOUSE: /tmp/m78-ci-wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Acquire hash-pinned M78 wheels for offline verification tests
        run: |
          python -m pip download --no-deps --only-binary=:all: --require-hashes -r ops/m78_sandbox/runtime-wheels.txt --dest /tmp/m78-ci-wheels
      - name: Focused M78 tests as nonroot
        run: |
          id
          test "$(id -u)" -ne 0
          python -m pytest -q tests/test_m78*.py
      - name: Focused M79 offline evidence tests
        run: python -m pytest -q tests/test_m79.py tests/test_m76.py tests/test_m78.py
      - name: Focused M80 synthetic pilot tests
        run: python -m pytest -q tests/test_m80.py tests/test_m79.py
      - name: Offline M80 synthetic demonstration
        run: python -B -m app.m80_demo --output /tmp/m80-ci-demo
      - name: Focused M81 readiness and historical import tests
        run: python -m pytest -q tests/test_m81.py tests/test_m80.py tests/test_m79.py
      - name: Focused M82 conservative profitability tests
        run: python -m pytest -q tests/test_m82.py tests/test_m81.py tests/test_m80.py tests/test_m79.py
      - run: python -m pytest -q
      - run: python -m app.orchestrator
      - run: ARBITRAGE_MODE=discovery ARBITRAGE_REPORT=var/discovery.xlsx python -m app.orchestrator
      - run: python -m app.demo
      - run: python -m app.offline_pilot
      - uses: actions/upload-artifact@v4
        with:
          name: sample-opportunity-report
          path: |
            var/*.xlsx
            var/demo/DEMO.*
            var/pilot-offline/PILOT-FIXTURE.xlsx
            var/pilot-offline/PILOT-FIXTURE.json
