name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m app.orchestrator
      - run: ARBITRAGE_MODE=discovery ARBITRAGE_REPORT=var/discovery.xlsx python -m app.orchestrator
      - run: python -m app.demo
      - run: python -m app.offline_pilot
      - uses: actions/upload-artifact@v4
        with:
          name: sample-opportunity-report
          path: |
            var/*.xlsx
            var/demo/DEMO.*
            var/pilot-offline/PILOT-FIXTURE.xlsx
            var/pilot-offline/PILOT-FIXTURE.json
